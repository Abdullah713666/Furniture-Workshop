        <div class="header-icon" aria-label="Search">
            <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
        </div>
    </header>

    <!-- Mobile Slide Menu -->
    <nav class="mobile-menu" aria-label="Mobile navigation">

    <!-- ==================== GALLERY HEADER ==================== -->
    <section class="gallery-header fade-up">
        <h1>The<br><span class="accent-text">Collection</span></h1>
        <p class="section-subtitle mt-1">Explore our curated selection of restored masterpieces and handcrafted
            furniture.</p>
    </section>

    <!-- ==================== FILTER BAR ==================== -->
    <div class="filter-bar fade-up" role="tablist" aria-label="Filter gallery">
        <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All</button>
        <button class="filter-btn" data-filter="restoration" role="tab" aria-selected="false">Restoration</button>
        <button class="filter-btn" data-filter="handcrafted" role="tab" aria-selected="false">Handcrafted</button>
        <button class="filter-btn" data-filter="baroque" role="tab" aria-selected="false">Baroque</button>
    </div>

    <!-- ==================== GALLERY GRID ==================== -->
    <div class="gallery-grid stagger-children" role="tabpanel">

        <!-- Item 1: Armoire -->
        <div class="gallery-item fade-up" data-category="restoration">
            <svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Antique wooden armoire"
                loading="lazy">
                <rect width="300" height="400" fill="#3d2e1a" />
                <rect x="70" y="40" width="160" height="300" rx="4" fill="#5a4530" />
                <line x1="150" y1="40" x2="150" y2="340" stroke="#4a3825" stroke-width="2" />
                <circle cx="140" cy="190" r="4" fill="#8a7560" />
                <circle cx="160" cy="190" r="4" fill="#8a7560" />
                <rect x="90" y="340" width="30" height="30" rx="2" fill="#4a3825" />
                <rect x="180" y="340" width="30" height="30" rx="2" fill="#4a3825" />
                <text x="150" y="390" text-anchor="middle" fill="#706050" font-size="11" font-family="serif">Antique
                    Armoire</text>
            </svg>
        </div>

        <!-- Item 2: Grandfather Clock -->
        <div class="gallery-item fade-up" data-category="restoration">
            <svg viewBox="0 0 300 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Grandfather clock"
                loading="lazy">
                <rect width="300" height="500" fill="#2e2419" />
                <rect x="100" y="30" width="100" height="120" rx="50 50 4 4" fill="#6b5540" />
                <circle cx="150" cy="80" r="40" fill="#8a7560" />
                <circle cx="150" cy="80" r="35" fill="#352c20" stroke="#8a7560" stroke-width="1" />
                <line x1="150" y1="80" x2="150" y2="55" stroke="#d4a843" stroke-width="2" />
                <line x1="150" y1="80" x2="168" y2="90" stroke="#d4a843" stroke-width="1.5" />
                <rect x="110" y="150" width="80" height="260" rx="3" fill="#5a4530" />
                <rect x="105" y="410" width="90" height="60" rx="4" fill="#6b5540" />
                <text x="150" y="485" text-anchor="middle" fill="#706050" font-size="11" font-family="serif">Grandfather
                    Clock</text>
            </svg>
        </div>

        <!-- Item 3: Oak Table Top -->
        <div class="gallery-item fade-up" data-category="handcrafted">
            <svg viewBox="0 0 300 250" xmlns="http://www.w3.org/2000/svg" role="img"
                aria-label="Oak table surface detail" loading="lazy">
                <rect width="300" height="250" fill="#5a4530" />
                <!-- Wood grain lines -->
                <line x1="0" y1="40" x2="300" y2="50" stroke="#6b5540" stroke-width="1" opacity="0.5" />
                <line x1="0" y1="80" x2="300" y2="75" stroke="#6b5540" stroke-width="0.8" opacity="0.4" />
                <line x1="0" y1="120" x2="300" y2="125" stroke="#6b5540" stroke-width="1.2" opacity="0.5" />
                <line x1="0" y1="155" x2="300" y2="150" stroke="#6b5540" stroke-width="0.6" opacity="0.3" />
                <line x1="0" y1="190" x2="300" y2="195" stroke="#6b5540" stroke-width="1" opacity="0.4" />
                <text x="150" y="235" text-anchor="middle" fill="#8a7560" font-size="11" font-family="serif">Oak Surface
                    Detail</text>
            </svg>
        </div>

        <!-- Item 4: Modern Chair -->
        <div class="gallery-item fade-up" data-category="handcrafted">
            <svg viewBox="0 0 300 350" xmlns="http://www.w3.org/2000/svg" role="img"
                aria-label="Handcrafted wooden chair" loading="lazy">
                <rect width="300" height="350" fill="#f5f0e8" />
                <rect x="110" y="120" width="80" height="10" rx="2" fill="#8a7560" />
                <rect x="120" y="50" width="60" height="70" rx="30 30 3 3" fill="#8a7560" />
                <rect x="120" y="130" width="8" height="140" fill="#6b5540" />
                <rect x="172" y="130" width="8" height="140" fill="#6b5540" />
                <rect x="100" y="265" width="100" height="5" rx="2" fill="#6b5540" />
                <rect x="115" y="270" width="8" height="50" fill="#6b5540" />
                <rect x="177" y="270" width="8" height="50" fill="#6b5540" />
                <text x="150" y="335" text-anchor="middle" fill="#706050" font-size="11" font-family="serif">Handcrafted
                    Chair</text>
            </svg>
        </div>

        <!-- Item 5: Baroque Armchair -->
        <div class="gallery-item fade-up" data-category="baroque">
            <svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Baroque style armchair"
                loading="lazy">
                <rect width="300" height="400" fill="#2a2018" />
                <!-- Ornate back -->
                <ellipse cx="150" cy="100" rx="70" ry="80" fill="#6b5540" />
                <ellipse cx="150" cy="105" rx="55" ry="60" fill="#e8dcc8" />
                <!-- Seat -->
                <rect x="80" y="180" width="140" height="60" rx="8" fill="#e8dcc8" />
                <!-- Arms -->
                <path d="M80 180 Q50 160 60 220 L80 240 Z" fill="#6b5540" />
                <path d="M220 180 Q250 160 240 220 L220 240 Z" fill="#6b5540" />
                <!-- Legs -->
                <path d="M95 240 Q85 280 75 320 Q70 340 90 340" fill="none" stroke="#6b5540" stroke-width="8" />
                <path d="M205 240 Q215 280 225 320 Q230 340 210 340" fill="none" stroke="#6b5540" stroke-width="8" />
                <text x="150" y="380" text-anchor="middle" fill="#706050" font-size="11" font-family="serif">Baroque
                    Armchair</text>
            </svg>
        </div>

        <!-- Item 6: Dresser -->
        <div class="gallery-item fade-up" data-category="restoration">
            <svg viewBox="0 0 300 250" xmlns="http://www.w3.org/2000/svg" role="img"
                aria-label="Antique dresser with mirror" loading="lazy">
                <rect width="300" height="250" fill="#f0ebe3" />
                <!-- Mirror -->
                <rect x="110" y="10" width="80" height="80" rx="3" fill="#c0b8a8" />
                <rect x="115" y="15" width="70" height="70" rx="2" fill="#ddd8d0" />
                <!-- Dresser body -->
                <rect x="40" y="90" width="220" height="120" rx="4" fill="#6b5540" />
                <!-- Drawers -->
                <rect x="50" y="100" width="200" height="30" rx="2" fill="#5a4530" />
                <circle cx="150" cy="115" r="3" fill="#8a7560" />
                <rect x="50" y="140" width="200" height="30" rx="2" fill="#5a4530" />
                <circle cx="150" cy="155" r="3" fill="#8a7560" />
                <rect x="50" y="180" width="200" height="25" rx="2" fill="#5a4530" />
                <circle cx="150" cy="192" r="3" fill="#8a7560" />
                <!-- Legs -->
                <rect x="55" y="210" width="10" height="20" rx="2" fill="#4a3825" />
                <rect x="235" y="210" width="10" height="20" rx="2" fill="#4a3825" />
                <text x="150" y="245" text-anchor="middle" fill="#706050" font-size="11" font-family="serif">Antique
                    Dresser</text>
            </svg>
        </div>

        <!-- Item 7: Writing Desk -->
        <div class="gallery-item fade-up" data-category="baroque">
            <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Baroque writing desk"
                loading="lazy">
                <rect width="300" height="300" fill="#3d2e1a" />
                <rect x="50" y="80" width="200" height="15" rx="2" fill="#6b5540" />
                <!-- Drawer front -->
                <rect x="60" y="95" width="180" height="50" rx="2" fill="#5a4530" />
                <circle cx="150" cy="120" r="4" fill="#d4a843" />
                <!-- Ornate legs -->
                <path d="M80 145 Q75 200 70 260" fill="none" stroke="#6b5540" stroke-width="8" stroke-linecap="round" />
                <path d="M220 145 Q225 200 230 260" fill="none" stroke="#6b5540" stroke-width="8"
                    stroke-linecap="round" />
                <text x="150" y="285" text-anchor="middle" fill="#706050" font-size="11" font-family="serif">Baroque
                    Writing Desk</text>
            </svg>
        </div>

        <!-- Item 8: Console Table -->
        <div class="gallery-item fade-up" data-category="handcrafted">
            <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img"
                aria-label="Handcrafted console table" loading="lazy">
                <rect width="300" height="300" fill="#2e2419" />
                <rect x="40" y="100" width="220" height="14" rx="2" fill="#8a7560" />
                <rect x="55" y="114" width="10" height="130" rx="2" fill="#6b5540" />
                <rect x="235" y="114" width="10" height="130" rx="2" fill="#6b5540" />
                <rect x="140" y="114" width="10" height="110" rx="2" fill="#6b5540" />
                <rect x="50" y="240" width="200" height="10" rx="2" fill="#6b5540" />
                <!-- Decor on top -->
                <rect x="80" y="75" width="40" height="25" rx="3" fill="#4a3825" />
                <circle cx="200" cy="87" r="12" fill="#4a3825" />
                <text x="150" y="280" text-anchor="middle" fill="#706050" font-size="11" font-family="serif">Console
                    Table</text>
            </svg>
        </div>

    </div>
